name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project Wave.xcodeproj \
            -scheme Wave \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        run: |
          SIM_ID=$(python3 - <<'PY'
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              ver = tuple(int(x) for x in re.findall(r"\d+", runtime))
              for d in devs:
                  name = d.get("name", "")
                  if d.get("isAvailable") and name.startswith("iPhone"):
                      pref = 2 if name == "iPhone 17" else (1 if name == "iPhone 16" else 0)
                      candidates.append((ver, pref, name, d["udid"]))
          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit("No available iPhone Simulator found")
          print(f"Selected simulator: {candidates[0][2]} {candidates[0][0]} ({candidates[0][3]})", file=sys.stderr)
          print(candidates[0][3])
          PY
          )
          xcodebuild test \
            -project Wave.xcodeproj \
            -scheme Wave \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/derived/Build/Products/Debug-iphoneos -maxdepth 1 -name 'Wave.app' -print -quit)
          echo "App bundle: $APP_PATH"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qr ../Wave-unsigned.ipa Payload)
          ls -lh build/Wave-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wave-unsigned-ipa
          path: build/Wave-unsigned.ipa
          if-no-files-found: error
